<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buhane Google Play Developer Banner</title>
  <style>
    :root {
      --ink: #111111;
      --muted: #4c4943;
      --hairline: rgba(17, 17, 17, 0.11);
      --hairline-strong: rgba(17, 17, 17, 0.22);
      --paper: #faf8f2;
      --paper-2: #fffdf8;
      --accent: #ff4f16;
      --accent-soft: rgba(255, 79, 22, 0.16);
      --shadow: rgba(34, 30, 22, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .banner-shell {
      position: absolute;
      left: 0;
      top: 0;
      width: 4096px;
      height: 2304px;
      transform: scale(var(--banner-scale, 1));
      transform-origin: top left;
    }

    .banner {
      position: relative;
      width: 4096px;
      height: 2304px;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 20%, rgba(255, 255, 255, 0.96) 0 18%, transparent 38%),
        radial-gradient(circle at 86% 74%, rgba(255, 79, 22, 0.065) 0 18%, transparent 48%),
        linear-gradient(180deg, #fffefd 0%, var(--paper) 100%);
    }

    .banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--hairline) 1px, transparent 1px),
        linear-gradient(90deg, var(--hairline) 1px, transparent 1px);
      background-size: 320px 320px;
      opacity: 0.78;
    }

    .banner::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(250, 248, 242, 0.78) 0%, rgba(250, 248, 242, 0.24) 18%, transparent 40%, rgba(250, 248, 242, 0.12) 100%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.72) 0%, transparent 26%, transparent 72%, rgba(250, 248, 242, 0.84) 100%);
      pointer-events: none;
    }

    .brand {
      position: absolute;
      z-index: 4;
      left: 300px;
      top: 760px;
      display: grid;
      grid-template-columns: 400px 1fr;
      align-items: center;
      column-gap: 104px;
      width: 1580px;
    }

    .brand-mark {
      width: 400px;
      height: 400px;
      object-fit: contain;
      filter: drop-shadow(0 32px 46px rgba(32, 26, 18, 0.12));
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-name {
      margin: 0;
      font-size: 280px;
      line-height: 0.84;
      font-weight: 850;
      letter-spacing: 0;
    }

    .brand-subtitle {
      margin: 48px 0 0;
      font-size: 103px;
      line-height: 1;
      font-weight: 440;
      letter-spacing: 0;
    }

    .statement {
      position: absolute;
      z-index: 4;
      left: 306px;
      top: 1352px;
      width: 1520px;
      padding-top: 88px;
      border-top: 2px solid var(--hairline-strong);
    }

    .statement-line {
      display: grid;
      grid-template-columns: 250px auto;
      column-gap: 48px;
      align-items: center;
    }

    .rule {
      height: 12px;
      width: 250px;
      background: var(--accent);
    }

    .tagline {
      margin: 0;
      font-size: 78px;
      line-height: 1.12;
      font-weight: 730;
      letter-spacing: 0;
    }

    .categories {
      margin: 52px 0 0 298px;
      color: var(--muted);
      font-size: 44px;
      line-height: 1.12;
      font-weight: 760;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .arc {
      position: absolute;
      z-index: 1;
      border: 3px solid rgba(17, 17, 17, 0.08);
      border-radius: 50%;
      pointer-events: none;
    }

    .arc-one {
      left: -440px;
      top: -580px;
      width: 1160px;
      height: 1160px;
    }

    .arc-two {
      left: 1650px;
      top: 1830px;
      width: 920px;
      height: 920px;
    }

    .network {
      position: absolute;
      z-index: 3;
      left: 1980px;
      top: 410px;
      width: 1760px;
      height: 1500px;
    }

    .network-lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .line {
      stroke: rgba(17, 17, 17, 0.28);
      stroke-width: 4;
      fill: none;
      vector-effect: non-scaling-stroke;
    }

    .line-soft {
      stroke: rgba(17, 17, 17, 0.13);
      stroke-width: 3;
      fill: none;
      stroke-dasharray: 26 22;
      vector-effect: non-scaling-stroke;
    }

    .node {
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: #111111;
      border: 5px solid var(--paper-2);
      box-shadow: 0 0 0 3px rgba(17, 17, 17, 0.14);
    }

    .node.orange {
      width: 54px;
      height: 54px;
      background: var(--accent);
      box-shadow: 0 0 0 13px var(--accent-soft), 0 24px 34px rgba(255, 79, 22, 0.20);
    }

    .node.gray {
      background: #aaa7a0;
      box-shadow: 0 0 0 3px rgba(17, 17, 17, 0.08);
    }

    .product-tile {
      position: absolute;
      display: grid;
      place-items: center;
      width: 252px;
      height: 252px;
      border: 2px solid rgba(17, 17, 17, 0.14);
      border-radius: 34px;
      background: rgba(255, 254, 250, 0.92);
      box-shadow: 0 28px 80px var(--shadow);
      overflow: hidden;
    }

    .product-tile.dark {
      background: #111111;
      border-color: rgba(255, 255, 255, 0.16);
      box-shadow: 0 36px 90px rgba(17, 17, 17, 0.16);
    }

    .product-tile.soft {
      background: rgba(255, 255, 255, 0.72);
    }

    .product-tile img {
      width: 154px;
      height: 154px;
      object-fit: contain;
      border-radius: 34px;
    }

    .product-tile.logo-icon img {
      width: 142px;
      height: 142px;
      border-radius: 30px;
    }

    .phone-frame,
    .browser-frame {
      position: absolute;
      border: 3px solid rgba(17, 17, 17, 0.15);
      background: rgba(255, 255, 255, 0.74);
      box-shadow: 0 28px 80px var(--shadow);
    }

    .phone-frame {
      width: 280px;
      height: 450px;
      border-radius: 38px;
      padding: 42px 34px;
    }

    .phone-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(17, 17, 17, 0.42);
    }

    .phone-menu {
      width: 40px;
      height: 22px;
      background:
        linear-gradient(currentColor 0 0) 0 0 / 40px 4px no-repeat,
        linear-gradient(currentColor 0 0) 0 9px / 28px 4px no-repeat,
        linear-gradient(currentColor 0 0) 0 18px / 34px 4px no-repeat;
    }

    .phone-dot {
      width: 28px;
      height: 28px;
      border: 4px solid currentColor;
      border-radius: 50%;
    }

    .phone-visual {
      margin-top: 68px;
      height: 164px;
      background:
        linear-gradient(180deg, transparent 0 70%, rgba(17, 17, 17, 0.10) 70% 100%),
        linear-gradient(135deg, transparent 0 34%, #bcb8b0 34% 54%, transparent 54%),
        linear-gradient(42deg, transparent 0 46%, #8f8b84 46% 68%, transparent 68%);
      border-radius: 8px;
      position: relative;
    }

    .phone-visual::after {
      content: "";
      position: absolute;
      right: 16px;
      top: 18px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--accent);
    }

    .phone-copy {
      margin-top: 48px;
      display: grid;
      gap: 18px;
    }

    .phone-copy span {
      display: block;
      height: 12px;
      border-radius: 999px;
      background: rgba(17, 17, 17, 0.10);
    }

    .phone-copy span:nth-child(1) {
      width: 82%;
    }

    .phone-copy span:nth-child(2) {
      width: 64%;
    }

    .phone-copy span:nth-child(3) {
      width: 52%;
    }

    .browser-frame {
      width: 570px;
      height: 360px;
      border-radius: 36px;
      padding: 42px;
    }

    .browser-dots {
      display: flex;
      gap: 20px;
      color: rgba(17, 17, 17, 0.24);
    }

    .browser-dots span {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: currentColor;
    }

    .browser-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 24px;
      margin-top: 78px;
    }

    .browser-grid span {
      display: block;
      height: 92px;
      border-radius: 12px;
      background: rgba(17, 17, 17, 0.08);
    }

    .browser-grid span:last-child {
      background: var(--accent);
    }

    .system-label {
      position: absolute;
      right: 330px;
      bottom: 390px;
      z-index: 4;
      color: rgba(17, 17, 17, 0.52);
      font-size: 28px;
      font-weight: 760;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .accent-baseline {
      position: absolute;
      z-index: 4;
      left: 304px;
      bottom: 258px;
      width: 650px;
      height: 8px;
      background: var(--accent);
    }
  </style>
</head>
<body>
  <div class="banner-shell">
    <main class="banner" aria-label="Buhane Information Technologies Google Play developer page banner">
      <span class="arc arc-one"></span>
      <span class="arc arc-two"></span>

      <section class="brand" aria-label="Buhane brand">
        <img class="brand-mark" src="../images/favicon.png" alt="">
        <div class="brand-copy">
          <h1 class="brand-name">BUHANE</h1>
          <p class="brand-subtitle">Information Technologies</p>
        </div>
      </section>

      <section class="statement" aria-label="Buhane positioning">
        <div class="statement-line">
          <span class="rule"></span>
          <p class="tagline">Independent Product Foundry</p>
        </div>
        <p class="categories">Apps / Games / SaaS</p>
      </section>

      <section class="network" aria-label="Buhane product network">
        <svg class="network-lines" viewBox="0 0 1760 1500" aria-hidden="true">
          <path class="line" d="M110 590H430V270H780" />
          <path class="line-soft" d="M430 270H1160V96" />
          <path class="line" d="M430 590H835V822H1210" />
          <path class="line-soft" d="M110 590L820 1040H1395" />
          <path class="line" d="M620 1040V1320H1360" />
          <path class="line-soft" d="M820 1040V610H1540" />
          <path class="line" d="M960 360V1040" />
          <path class="line-soft" d="M1220 230V1040" />
          <path class="line" d="M1338 610V260H1608" />
          <path class="line-soft" d="M1450 822V1290H1710" />
          <path class="line" d="M190 1100H620" />
          <path class="line-soft" d="M180 140H1510" />
        </svg>

        <span class="node" style="left: 96px; top: 574px;"></span>
        <span class="node orange" style="left: 805px; top: 1012px;"></span>
        <span class="node gray" style="left: 416px; top: 256px;"></span>
        <span class="node orange" style="left: 940px; top: 114px;"></span>
        <span class="node" style="left: 1194px; top: 214px;"></span>
        <span class="node gray" style="left: 1510px; top: 246px;"></span>
        <span class="node orange" style="left: 1528px; top: 590px;"></span>
        <span class="node" style="left: 1210px; top: 1032px;"></span>
        <span class="node gray" style="left: 590px; top: 1310px;"></span>
        <span class="node" style="left: 1688px; top: 1280px;"></span>

        <article class="product-tile logo-icon" style="left: 360px; top: 280px;">
          <img src="../images/products/swipe-slip.png" alt="">
        </article>
        <article class="product-tile dark" style="left: 820px; top: 490px;">
          <img src="../images/products/gridzle.png" alt="">
        </article>
        <article class="product-tile" style="left: 820px; top: 40px;">
          <img src="../images/products/astral-post.png" alt="">
        </article>
        <article class="product-tile soft" style="left: 1264px; top: 780px;">
          <img src="../images/products/lastimo.png" alt="">
        </article>
        <article class="product-tile logo-icon" style="left: 480px; top: 890px;">
          <img src="../images/products/glow-spin.png" alt="">
        </article>
        <article class="product-tile" style="left: 1110px; top: 980px;">
          <img src="../images/products/u2m.png" alt="">
        </article>

        <div class="phone-frame" style="left: 1320px; top: 260px;" aria-hidden="true">
          <div class="phone-top">
            <span class="phone-menu"></span>
            <span class="phone-dot"></span>
          </div>
          <div class="phone-visual"></div>
          <div class="phone-copy">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <div class="phone-frame" style="left: 320px; top: 1050px;" aria-hidden="true">
          <div class="phone-top">
            <span class="phone-menu"></span>
            <span class="phone-dot"></span>
          </div>
          <div class="phone-visual"></div>
          <div class="phone-copy">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <div class="browser-frame" style="left: 1170px; top: 1110px;" aria-hidden="true">
          <div class="browser-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="browser-grid">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </section>

      <p class="system-label">Product Network</p>
      <span class="accent-baseline"></span>
    </main>
  </div>

  <script>
    const scaleBanner = () => {
      const scale = Math.min(window.innerWidth / 4096, window.innerHeight / 2304);
      document.documentElement.style.setProperty("--banner-scale", String(scale));
    };

    scaleBanner();
    window.addEventListener("resize", scaleBanner);
  </script>
</body>
</html>
